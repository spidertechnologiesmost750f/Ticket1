<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster Mobile App Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .tm-barcode { display:flex; align-items:stretch; justify-content:center; height:56px; gap:1px; overflow:hidden; }
        .tm-barcode span { display:block; background:#111; }
        .tm-barcode span.blue { background:#2563eb; }
        @keyframes barcode-shift { 0% { transform: translateX(0); } 100% { transform: translateX(-6px); } }
        .tm-barcode { animation: barcode-shift 0.7s steps(3) infinite; }
        .tm-msg-bubble {
            width: 118px; height: 86px; position: relative; margin: 0 auto;
        }
        .tm-msg-bubble .bubble {
            width: 100%; height: 70px; background: #f4f6f8; border-radius: 18px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .tm-msg-bubble .bubble:after {
            content: ''; position: absolute; left: 22px; bottom: -12px;
            width: 0; height: 0; border-left: 10px solid transparent;
            border-right: 16px solid transparent; border-top: 16px solid #f4f6f8;
        }
        .tm-msg-bubble .card {
            width: 62px; height: 42px; background: #2563eb; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            color: #fff; font-weight: 800; letter-spacing: 1px; font-size: 16px;
        }
        .tm-msg-bubble .lock {
            position: absolute; right: 8px; top: 38px; width: 28px; height: 32px;
            background: #f5c518; border-radius: 6px; box-shadow: 0 1px 0 rgba(0,0,0,.12);
        }
        .tm-msg-bubble .lock:before {
            content: ''; position: absolute; left: 6px; top: -10px; width: 16px; height: 14px;
            border: 4px solid #f5c518; border-bottom: none; border-radius: 10px 10px 0 0;
        }
        .tm-action-pill { box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-900 flex justify-center items-center min-h-screen font-sans antialiased select-none">

    <!-- Mobile Phone Frame Container - Optimized Padding -->
    <div id="phone-frame" class="w-full max-w-[410px] bg-black h-[100dvh] max-h-[100dvh] md:h-[min(820px,100dvh)] md:max-h-[820px] flex flex-col shadow-2xl relative overflow-hidden rounded-none border-0 pt-0 pb-0 md:rounded-[36px] md:border-[8px] md:border-neutral-900 md:pt-2 md:pb-1">

        <!-- App Dynamic Content Area -->
        <div id="app-view" class="flex-1 overflow-y-auto relative bg-white pb-16 min-h-0 h-full">
            <!-- Dynamic Views Injected Here -->
        </div>

        <!-- Global Bottom Navigation Bar -->
        <div id="bottom-nav" class="bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center text-[10px] text-gray-500 z-50 absolute bottom-0 left-0 right-0">
            <button onclick="switchViewWithLoader('discover')" class="flex flex-col items-center focus:outline-none transition text-blue-600 font-bold" id="nav-discover">
                <i class="fa-solid fa-magnifying-glass text-sm mb-0.5"></i>
                <span>Discover</span>
            </button>
            <button onclick="switchViewWithLoader('events')" class="flex flex-col items-center focus:outline-none transition hover:text-black">
                <i class="fa-regular fa-heart text-sm mb-0.5"></i>
                <span class="font-medium">Favorites</span>
            </button>
            <button onclick="switchViewWithLoader('events')" class="flex flex-col items-center focus:outline-none text-gray-500" id="nav-tickets">
                <i class="fa-solid fa-ticket text-sm mb-0.5"></i>
                <span>My Tickets</span>
            </button>
            <button onclick="switchViewWithLoader('events')" class="flex flex-col items-center focus:outline-none transition hover:text-black">
                <i class="fa-solid fa-tag text-sm mb-0.5"></i>
                <span class="font-medium">Sell</span>
            </button>
            <button onclick="switchViewWithLoader('account')" class="flex flex-col items-center focus:outline-none relative transition hover:text-black" id="nav-account">
                <i class="fa-regular fa-user text-sm mb-0.5"></i>
                <span class="font-medium">My Account</span>
                <span id="account-dot" class="absolute -top-0.5 right-2 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
            </button>
        </div>

        <!-- OTP Toast Notification Bar -->
        <div id="otp-toast" class="hidden absolute inset-x-4 top-14 z-[60] flex justify-center pointer-events-none">
            <div class="bg-neutral-900 text-white text-[11px] font-medium rounded-xl px-4 py-2.5 shadow-2xl text-center max-w-[320px] leading-snug">
                OTP to receive tickets has been sent to your email
            </div>
        </div>

        <!-- Transfer success overlay (screenshot style) -->
        <div id="transfer-success-overlay" class="hidden absolute inset-0 z-[80] bg-black/55 flex items-center justify-center px-6">
            <div class="bg-white rounded-2xl w-full px-5 pt-8 pb-5 text-center shadow-2xl">
                <div class="w-[68px] h-[68px] mx-auto mb-4 rounded-full border-[3px] border-blue-500 flex items-center justify-center">
                    <i class="fa-solid fa-check text-blue-500 text-[28px]"></i>
                </div>
                <h2 class="text-[22px] font-black text-gray-900 tracking-tight">Successful!</h2>
                <p class="text-[13px] text-gray-500 mt-1.5 mb-6">Ticket Transfer was successful.</p>
                <button onclick="closeTransferSuccessOverlay()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-[15px]">OK</button>
            </div>
        </div>

    </div>

    <!-- JavaScript Application Logic & Persistent Storage -->
    <script>
        let defaultEvents = [
            {
                id: 1,
                showTitle: "STRAY KIDS WORLD TOUR < RUN IT SINGAPORE >",
                ticketType: "CAT 2 Standard",
                imageLink: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
                date: "Aug 16",
                time: "06:00 PM",
                dayOfWeek: "Saturday",
                country: "Singapore",
                flagLink: "🇸🇬",
                location: "Singapore",
                venue: "Singapore Indoor Stadium",
                sec: "111",
                row: "A",
                startSeat: 6,
                numTickets: 4,
                minTransferLimit: 1,
                username: "Chester leong",
                orderNumber: "QZ232-533R",
                email: "chesterleong875@gmail.com",
                phoneLast4: "3321",
                mapQuery: "Singapore+Indoor+Stadium"
            }
        ];

        let events = JSON.parse(localStorage.getItem('tm_clone_events')) || defaultEvents;
        function saveEventsToStorage() {
            localStorage.setItem('tm_clone_events', JSON.stringify(events));
        }

        let appSettings = Object.assign({
            allowScreenshots: true,
            blurReference: false,
            hiddenEvents: {},
            transferEnabled: true
        }, JSON.parse(localStorage.getItem('tm_clone_settings') || '{}'));
        function saveSettingsToStorage() {
            localStorage.setItem('tm_clone_settings', JSON.stringify(appSettings));
        }

        let userNotifications = JSON.parse(localStorage.getItem('tm_clone_notifs')) || [
            {
                id: 1,
                title: "Welcome to Ticketmaster",
                message: "Your account is active and verified for secure mobile ticket management.",
                time: "2h ago",
                unread: true
            }
        ];
        function saveNotifsToStorage() {
            localStorage.setItem('tm_clone_notifs', JSON.stringify(userNotifications));
        }

        let currentView = 'discover';
        let lastView = 'discover';
        let activeEventId = events[0]?.id || 1;
        let editingEventId = null;
        let selectedSeatsState = {};
        let activeTicketIndex = 0;
        let otpToastTimer = null;
        let lastFailedRecipient = { name: '', email: '', count: 0, minRequired: 1 };

        function addNotification(title, message, timeText = "Just now") {
            userNotifications.unshift({
                id: Date.now(),
                title: title,
                message: message,
                time: timeText,
                unread: true
            });
            saveNotifsToStorage();
            updateAccountDot();
        }

        function updateAccountDot() {
            const dot = document.getElementById('account-dot');
            if (!dot) return;
            const hasUnread = userNotifications.some(n => n.unread);
            if (hasUnread) dot.classList.remove('hidden');
            else dot.classList.add('hidden');
        }

        function generate_buyer_receipt(buyerName, buyerEmail, amountPaid) {
            const ev = events.find(e => e.id === activeEventId) || events[0];
            return `Subject: Your Order Confirmation for ${ev.showTitle} - Order #${ev.orderNumber}

Hi ${buyerName},

Thank you for your purchase! Your tickets are secured. Below are your order details:

=========================================
ORDER DETAILS
=========================================
Order Number: #${ev.orderNumber}
Purchase Date: ${new Date().toLocaleDateString()}
Original Account Owner: ${ev.username} (${ev.email})
Delivery Method: Digital Transfer to ${buyerEmail}

=========================================
TICKET INFO
=========================================
Event: ${ev.showTitle}
Date/Time: ${ev.date} at ${ev.time}
Venue: ${ev.venue}
Seat Layout: Section ${ev.sec}, Row ${ev.row}, Seat ${ev.startSeat}

Total Charged: \$${amountPaid}
=========================================

What's Next?
You will receive a separate email from Ticketmaster inviting you to accept your ticket transfer. Click "Accept Transfer" in that email and log in with ${buyerEmail} to claim your live barcodes.`;
        }

        function switchViewWithLoader(view, eventId = null) {
            const container = document.getElementById('app-view');
            const bottomNav = document.getElementById('bottom-nav');
            if (view !== currentView) lastView = currentView;
            
            if (eventId !== null) activeEventId = eventId;

            container.innerHTML = `
                <div class="h-full flex flex-col justify-center items-center bg-white">
                    <div class="w-7 h-7 border-3 border-gray-200 border-t-blue-600 rounded-full spinner mb-2"></div>
                    <span class="text-[11px] text-gray-400 font-medium">Loading...</span>
                </div>
            `;
            if (['auth', 'transfer-select', 'transfer-method', 'transfer-form', 'barcode', 'manager', 'help-modal', 'notifications-view', 'edit-notif-modal', 'transfer-success', 'transfer-failed'].includes(view)) {
                bottomNav.classList.add('hidden');
                container.classList.remove('pb-16');
            } else {
                bottomNav.classList.remove('hidden');
                container.classList.add('pb-16');
            }

            setTimeout(() => {
                currentView = view;
                if (eventId !== null && view === 'transfer-select') initSeatStateEmpty();
                render();
                container.scrollTop = 0;
                if (view === 'transfer-success') showOtpToast();
                else hideOtpToast();
            }, 250);
        }

        function initSeatStateEmpty() {
            const ev = events.find(e => e.id === activeEventId);
            if (!ev) return;
            selectedSeatsState = {};
            for (let i = 0; i < ev.numTickets; i++) {
                selectedSeatsState[ev.startSeat + i] = false;
            }
        }

        function toggleSeatSelection(seatNum) {
            selectedSeatsState[seatNum] = !selectedSeatsState[seatNum];
            render();
        }

        function validateAndProceedTransfer() {
            const selectedCount = Object.values(selectedSeatsState).filter(Boolean).length;
            const ev = events.find(e => e.id === activeEventId) || events[0];
            const minReq = ev.minTransferLimit || 1;

            if (selectedCount < minReq) {
                lastFailedRecipient = { count: selectedCount, minRequired: minReq };
                switchViewWithLoader('transfer-failed');
                return;
            }
            if (selectedCount === 0) {
                alert("Please select at least one ticket to transfer.");
                return;
            }
            switchViewWithLoader('transfer-method');
        }

        function executeTransferSubmission() {
            const fName = document.getElementById('recipient-fname')?.value || 'Guest';
            const lName = document.getElementById('recipient-lname')?.value || 'User';
            const email = document.getElementById('recipient-email')?.value
                || document.getElementById('recipient-phone')?.value
                || 'recipient@gmail.com';
            const selectedCount = Object.values(selectedSeatsState).filter(Boolean).length;
            const ev = events.find(e => e.id === activeEventId) || events[0];
            const minReq = ev.minTransferLimit || 1;

            if (selectedCount < minReq) {
                lastFailedRecipient = { name: `${fName} ${lName}`, email: email, count: selectedCount, minRequired: minReq };
                addNotification(
                    "Ticket Transfer Failed",
                    `Transfer to ${fName} ${lName} (${email}) for ${ev.showTitle} could not be completed. Selected ${selectedCount} ticket(s), but event minimum requirement is ${minReq}.`,
                    "Just now"
                );
                switchViewWithLoader('transfer-failed');
                return;
            }

            addNotification(
                "Transfer Pending Acceptance",
                `You transferred tickets for ${ev.showTitle} to ${fName} ${lName} (${email}). Waiting for receiver to accept it.`,
                "Just now"
            );
            showTransferSuccessOverlay(true);
        }

        function showTransferSuccessOverlay(goToDetails = false) {
            if (goToDetails) {
                lastView = currentView;
                currentView = 'details';
                const bottomNav = document.getElementById('bottom-nav');
                const container = document.getElementById('app-view');
                if (bottomNav) bottomNav.classList.remove('hidden');
                if (container) {
                    container.classList.add('pb-16');
                    render();
                    container.scrollTop = 0;
                }
            }
            const overlay = document.getElementById('transfer-success-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function closeTransferSuccessOverlay() {
            const overlay = document.getElementById('transfer-success-overlay');
            if (overlay) overlay.classList.add('hidden');
            if (currentView !== 'details') {
                switchViewWithLoader('details', activeEventId);
            }
        }

        function closeSuccessModal() {
            hideOtpToast();
            closeTransferSuccessOverlay();
        }

        function toggleRecipientContact() {
            const emailWrap = document.getElementById('recipient-email-wrap');
            const phoneWrap = document.getElementById('recipient-phone-wrap');
            const link = document.getElementById('recipient-contact-toggle');
            if (!emailWrap || !phoneWrap || !link) return;
            const usingEmail = !emailWrap.classList.contains('hidden');
            if (usingEmail) {
                emailWrap.classList.add('hidden');
                phoneWrap.classList.remove('hidden');
                link.textContent = 'Use Email Instead';
            } else {
                phoneWrap.classList.add('hidden');
                emailWrap.classList.remove('hidden');
                link.textContent = 'Use Mobile Number Instead';
            }
        }

        function showOtpToast() {
            const toast = document.getElementById('otp-toast');
            if (!toast) return;
            toast.classList.remove('hidden');
            if (otpToastTimer) clearTimeout(otpToastTimer);
            otpToastTimer = setTimeout(() => {
                hideOtpToast();
            }, 2000);
        }

        function hideOtpToast() {
            const toast = document.getElementById('otp-toast');
            if (toast) toast.classList.add('hidden');
            if (otpToastTimer) {
                clearTimeout(otpToastTimer);
                otpToastTimer = null;
            }
        }

        function startTransferFlow() {
            if (!appSettings.transferEnabled) return;
            switchViewWithLoader('auth');
        }

        function toggleTransferEnabled() {
            appSettings.transferEnabled = !appSettings.transferEnabled;
            saveSettingsToStorage();
            render();
        }

        function openTicketView(index = 0) {
            activeTicketIndex = index;
            switchViewWithLoader('barcode');
        }

        function shiftTicket(delta) {
            const ev = events.find(e => e.id === activeEventId);
            if (!ev || !ev.numTickets) return;
            activeTicketIndex = (activeTicketIndex + delta + ev.numTickets) % ev.numTickets;
            currentView = 'barcode';
            render();
        }

        function barcodeBarsHtml(seed) {
            const widths = [2,7,3,9,2,5,4,8,3,6,2,10,3,5,7,2,8,4,3,6,2,9,4,5,3,8,2,6,4,7,3,5];
            return widths.map((w, i) => `<span class="${(seed + i) % 9 === 0 ? 'blue' : ''}" style="width:${w}px"></span>`).join('');
        }

        function saveEventForm(event) {
            event.preventDefault();
            const locationVal = document.getElementById('form-location').value;
            const countryVal = document.getElementById('form-country').value;
            const flagVal = document.getElementById('form-flagLink').value;
            const minLimitVal = parseInt(document.getElementById('form-minLimit').value) || 1;

            const formData = {
                id: editingEventId ? editingEventId : Date.now(),
                showTitle: document.getElementById('form-showTitle').value,
                ticketType: document.getElementById('form-ticketType').value,
                imageLink: document.getElementById('form-imageLink').value,
                date: document.getElementById('form-date').value,
                time: document.getElementById('form-time').value,
                dayOfWeek: document.getElementById('form-dayOfWeek').value,
                country: countryVal,
                flagLink: flagVal,
                location: locationVal,
                venue: document.getElementById('form-venue').value,
                sec: document.getElementById('form-sec').value,
                row: document.getElementById('form-row').value,
                startSeat: parseInt(document.getElementById('form-startSeat').value) || 1,
                numTickets: parseInt(document.getElementById('form-numTickets').value) || 1,
                minTransferLimit: minLimitVal,
                username: document.getElementById('form-username').value,
                orderNumber: document.getElementById('form-orderNumber').value,
                email: document.getElementById('form-email').value,
                phoneLast4: document.getElementById('form-phoneLast4').value || '3321',
                mapQuery: encodeURIComponent(`${locationVal}+${document.getElementById('form-venue').value}`)
            };

            if (editingEventId) {
                const index = events.findIndex(e => e.id === editingEventId);
                if (index !== -1) events[index] = formData;
            } else {
                events.unshift(formData);
            }
            saveEventsToStorage();
            editingEventId = null;
            switchViewWithLoader('help-modal');
        }

        function deleteEvent(id) {
            if(confirm("Are you sure you want to permanently delete this event?")) {
                events = events.filter(e => e.id !== id);
                saveEventsToStorage();
                switchViewWithLoader('help-modal');
            }
        }

        function openManager(id = null) {
            editingEventId = id;
            switchViewWithLoader('manager');
        }

        let editingNotifId = null;
        function deleteNotification(id) {
            userNotifications = userNotifications.filter(n => n.id !== id);
            saveNotifsToStorage();
            switchViewWithLoader('help-modal');
        }

        function saveEditedNotification(event) {
            event.preventDefault();
            const t = document.getElementById('edit-notif-title').value;
            const m = document.getElementById('edit-notif-msg').value;
            const timeVal = document.getElementById('edit-notif-time').value;
            const n = userNotifications.find(x => x.id === editingNotifId);
            if (n) {
                n.title = t;
                n.message = m;
                n.time = timeVal;
                saveNotifsToStorage();
            }
            editingNotifId = null;
            switchViewWithLoader('help-modal');
        }

        function render() {
            const container = document.getElementById('app-view');
            const activeEv = events.find(e => e.id === activeEventId) || events[0] || {};
            const visibleEvents = events.filter(e => !appSettings.hiddenEvents[e.id]);
            
            const navDiscover = document.getElementById('nav-discover');
            const navTickets = document.getElementById('nav-tickets');
            const navAccount = document.getElementById('nav-account');
            
            if(navDiscover && navTickets && navAccount) {
                navDiscover.className = "flex flex-col items-center focus:outline-none transition " + (currentView === 'discover' ? "text-blue-600 font-bold" : "text-gray-500");
                navTickets.className = "flex flex-col items-center focus:outline-none transition " + (currentView === 'events' ? "text-blue-600 font-bold" : "text-gray-500");
                navAccount.className = "flex flex-col items-center focus:outline-none relative transition " + (currentView === 'account' ? "text-black font-bold" : "text-gray-500");
            }
            updateAccountDot();

            if (currentView === 'discover') {
                const featuredEv = visibleEvents[0] || events[0] || {};
                container.innerHTML = `
                    <div class="bg-black text-white pb-5">
                        <div class="px-4 py-2.5 flex justify-between items-center border-b border-neutral-900">
                            <span class="italic font-black text-base tracking-tight">ticketmaster</span>
                            <span class="text-sm">${featuredEv.flagLink || '🇸🇬'}</span>
                        </div>

                        <div class="px-4 py-2.5 flex justify-between items-center text-xs text-gray-300">
                            <div class="flex items-center space-x-2">
                                <i class="fa-solid fa-location-dot text-xs"></i>
                                <div>
                                    <div class="text-[8px] font-bold text-gray-400 uppercase tracking-wider">LOCATION</div>
                                    <div class="font-bold text-white text-[10px]">${featuredEv.country || 'Singapore'}</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 text-right">
                                <i class="fa-regular fa-calendar text-xs"></i>
                                <div>
                                    <div class="text-[8px] font-bold text-gray-400 uppercase tracking-wider">DATES</div>
                                    <div class="font-bold text-white text-[10px]">All Dates <i class="fa-solid fa-chevron-down text-[8px] ml-0.5"></i></div>
                                </div>
                            </div>
                        </div>

                        <div class="px-3 my-1.5">
                            <div class="bg-white rounded-xl p-2.5 flex justify-between items-center text-gray-400 shadow-inner">
                                <div class="text-xs">
                                    <div class="text-[8px] font-black text-gray-400 tracking-wider uppercase">SEARCH</div>
                                    <div class="text-gray-800 font-medium text-[11px]">Artist, Event or Venue</div>
                                </div>
                                <i class="fa-solid fa-magnifying-glass text-blue-600 text-sm"></i>
                            </div>
                        </div>

                        <div class="relative mt-2 h-56 bg-cover bg-center overflow-hidden" style="background-image: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.2) 60%), url('${featuredEv.imageLink}');">
                            <div class="absolute top-2.5 left-2.5 right-2.5 flex space-x-1.5 overflow-x-auto text-[10px] font-bold">
                                <span class="bg-black/60 border border-white/40 px-2.5 py-0.5 rounded">Concert</span>
                                <span class="bg-black/60 border border-white/40 px-2.5 py-0.5 rounded">Sports</span>
                                <span class="bg-black/80 border border-white px-2.5 py-0.5 rounded">Art</span>
                            </div>

                            <div class="absolute bottom-3 left-3 right-3 flex justify-between items-end">
                                <div>
                                    <h2 class="text-sm font-black italic tracking-wide text-white drop-shadow-md leading-tight">${featuredEv.showTitle}</h2>
                                    <button onclick="switchViewWithLoader('details', ${featuredEv.id})" class="mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[11px] px-3.5 py-1.5 rounded-lg shadow-lg">
                                        Find Tickets
                                    </button>
                                </div>
                                <div class="w-7 h-7 bg-white text-black rounded-full flex items-center justify-center shadow-lg cursor-pointer">
                                    <i class="fa-solid fa-play text-[10px] pl-0.5"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white text-gray-900 pt-4 pb-3 px-3 mt-1.5">
                            <h3 class="text-center text-xs font-black tracking-widest uppercase text-gray-900 mb-3">POPULAR NEAR YOU</h3>
                            <div class="grid grid-cols-2 gap-2.5">
                                <div class="h-28 rounded-xl overflow-hidden relative bg-cover bg-center shadow-sm flex items-center justify-center text-white" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80');">
                                    <span class="text-2xl font-black italic">50%</span>
                                </div>
                                <div class="h-28 rounded-xl overflow-hidden relative bg-cover bg-center shadow-sm flex items-end p-2 text-white" style="background-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent), url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80');">
                                    <span class="text-[11px] font-bold leading-tight">Live Night Concert</span>
                                </div>
                            </div>
                        </div>
